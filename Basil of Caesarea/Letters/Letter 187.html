<article class="writing"><h1>Letter 187</h1>
<i>Antipater to Basil</i>.<br/><br/>
"Twice cabbage is death," says the unkind proverb. I, however, though I have called for it often, shall die once. Yes: even though I had never called for it at all! If you do die anyhow, don't fear to eat a delicious relish, unjustly reviled by the proverb!<br/><br/>

</article>
