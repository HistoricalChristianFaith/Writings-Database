<article class="writing"><h1>Letter 25 From Peter Chrysologus, Bishop of Ravenna, to Eutyches, the Presbyter</h1>
[In answer to a letter from Eutyches, he urges him to accept the decisions of the Church on the Faith in fear and without too close inquiry, and to abide by the ruling of the bishop of Rome.]<br/><br/>
