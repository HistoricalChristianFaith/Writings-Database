<article class="writing"><h1>The Ratification</h1>
And those who say <i>There was a time when He was not</i>, or that <i>Before He was begotten He was not</i>, or that <i>He was made out of nothing</i>; or who say that <i>The Son of God is of any other substance</i>, or that <i>He is changeable</i> or <i>unstable</i>,-these the Catholic and Apostolic Church anathematizes.<br/><br/>

</article>
